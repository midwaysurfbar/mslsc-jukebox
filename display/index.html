<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MSLSC Jukebox — Display</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <video id="deckA" class="deck" playsinline></video>
    <video id="deckB" class="deck" playsinline></video>
    <div id="adOverlay" class="ad-overlay">
      <img id="adImage" alt="" />
    </div>
    <div id="idle" class="idle">
      <p>MSLSC Jukebox</p>
      <small>Queue something from the control panel to get started.</small>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
